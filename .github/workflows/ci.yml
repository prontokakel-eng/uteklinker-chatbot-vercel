name: ChatBot CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "work/prelaunch-guards-2026-10-17", "work/knowledge-source-guards-2026-10-17"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        run: npm ci

      - name: ✅ Run AUDIT
        run: npm run audit

      - name: ✅ Run DETECT-LANG TESTS
        run: npm run test:lang

      - name: Lint runtime code
        run: npm run lint

      - name: Run all regressions including the active Preview path
        run: npm test
