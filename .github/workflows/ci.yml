name: ChatBot CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "work/prelaunch-guards-2026-10-17", "work/knowledge-source-guards-2026-10-17"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        run: npm ci

      - name: ✅ Run AUDIT
        run: npm run audit

      - name: ✅ Run DETECT-LANG TESTS
        run: npm run test:lang

      - name: Test customer dialogue and early abuse protection
        run: node --test tests/customer-flow.test.mjs tests/anti-abuse.test.mjs tests/conversation.test.mjs tests/faq-colour-match.test.mjs tests/support-hours.test.mjs tests/contact-ui.test.mjs tests/prelaunch-guards.test.mjs tests/embed-privacy.test.mjs tests/places-contact.test.mjs tests/knowledge-safety.test.mjs tests/ai-review.test.mjs tests/warranty-policy.test.mjs tests/website-knowledge.test.mjs tests/chat-brand.test.mjs tests/ui-language.test.mjs tests/website-opening-hours.test.mjs tests/starter-guidance.test.mjs
